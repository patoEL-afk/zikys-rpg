<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101610">
<title>ZIKYS RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0a0a0f;
  --panel:#121218;
  --panel2:#1a1a22;
  --panel3:#22222c;
  --line:#2e2e3a;
  --line2:#4a3a6a;
  --green:#7fd16a;
  --bright:#d4f0a0;
  --accent:#a070e0;
  --purple:#b070e8;
  --purple2:#8a4ad1;
  --blue:#6ab0d1;
  --purple:#b07ad1;
  --orange:#d1a06a;
  --gold:#e0c070;
  --muted:#8a9a84;
  --muted2:#6b7a66;
  --red:#d07a72;
  --red-soft:#3a2220;
  --text:#eef3ea;
  --text2:#d5decf;
  --shadow:0 4px 24px rgba(0,0,0,.45);
  --radius:12px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  line-height:1.45;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;transition:all .15s ease}

/* TOP BAR */
.top{
  height:68px;
  background:linear-gradient(180deg,#6a3aad,#4a2a8a);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:6px;
  color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);
  text-shadow:0 0 20px rgba(197,230,154,.15);
}
.logo small{
  display:block;
  font-size:9px;
  letter-spacing:4px;
  color:var(--muted);
  margin-top:2px;
  font-weight:600;
}
.operator{
  font-size:12px;
  color:var(--muted);
  font-weight:500;
  letter-spacing:.5px;
}

/* LAYOUT */
.layout{
  display:grid;
  grid-template-columns:240px minmax(0,1fr);
  min-height:calc(100vh - 68px);
}
.sidebar{
  background:#0c110c;
  border-right:1px solid var(--line);
  padding:18px 12px;
}
.navtitle{
  font-size:10px;
  letter-spacing:2.5px;
  color:var(--muted2);
  margin:20px 12px 8px;
  font-weight:700;
}
.nav{
  display:block;
  width:100%;
  text-align:left;
  padding:13px 14px;
  background:transparent;
  border:1px solid transparent;
  border-radius:10px;
  color:#b0bca8;
  margin:4px 0;
  font-size:13.5px;
  font-weight:500;
  letter-spacing:.3px;
}
.nav.active,.nav:hover{
  background:var(--panel2);
  border-color:var(--line2);
  color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);
}
.nav.active{box-shadow:inset 3px 0 0 var(--green)}

.main{
  padding:28px;
  max-width:1480px;
  width:100%;
  margin:auto;
}

/* HEADINGS */
.heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-bottom:24px;
}
h1{font-size:22px;margin:0 0 6px;font-weight:800;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 16px;font-weight:700;color:var(--text)}
h3{font-size:14px;color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);margin:0 0 8px}
.sub,.muted{color:var(--muted);font-size:13px}
.sub{margin-top:2px}

/* PANELS & CARDS */
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.panel h2{margin-top:0}

/* BUTTONS */
.btn{
  background:linear-gradient(180deg,#2a3d28,#243522);
  border:1px solid #4a6148;
  color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);
  padding:8px 12px;
  border-radius:9px;
  font-weight:600;
  font-size:13px;
  letter-spacing:.3px;
}
.btn:hover{background:linear-gradient(180deg,#324a30,#2a3d28);border-color:var(--green)}
.btn.red{
  background:linear-gradient(180deg,#4a2a28,#3d2220);
  border-color:#6a3a36;
  color:#f0c0bc;
}
.btn.red:hover{background:linear-gradient(180deg,#5a3532,#4a2a28)}
.btn.gray{
  background:#1a221a;
  border-color:#3a4a3a;
  color:var(--muted);
}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* FORMS */
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.3px}
input,select,textarea{
  width:100%;
  background:#0e140e;
  border:1px solid var(--line);
  color:var(--text);
  padding:10px 12px;
  border-radius:8px;
  outline:none;
  transition:border .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(157,190,110,.15);
}
textarea{min-height:90px;resize:vertical}

/* GRIDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* AGENT / CHARACTER CARDS */
.agent{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:14px;
  padding:0;
  overflow:hidden;
  display:flex;
  transition:transform .15s,border .15s;
}
.agent:hover{border-color:var(--purple);transform:translateY(-2px)}
.agent-portrait{
  width:110px;min-width:110px;height:130px;
  background:#0a0a10;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.agent-portrait img{width:100%;height:100%;object-fit:cover}
.agent-info{padding:14px;flex:1;display:flex;flex-direction:column;justify-content:center}
.agent-info .agenttitle{font-size:17px;margin:0 0 4px}
.agent:hover{border-color:var(--line2);transform:translateY(-1px)}
.agenttitle{font-size:16px;font-weight:700;color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);margin-bottom:4px}
.agent .muted{font-size:12.5px}

/* PORTRAIT */
.portrait{
  width:110px;height:130px;
  background:#0a0f0a;
  border:2px solid var(--line2);
  border-radius:10px;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait.large{width:140px;height:165px}

/* CHARACTER HEADER */
.character-header{
  display:flex;
  gap:20px;
  align-items:flex-start;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:20px;
}

/* RESOURCES / STATUS BARS */
.resource{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}
.resource h3{margin:0 0 10px;font-size:14px}
.resourcefields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}
.bar{
  height:10px;
  background:#0a0f0a;
  border-radius:6px;
  overflow:hidden;
  border:1px solid #2a3a2a;
  margin:6px 0 10px;
}
.bar > div{
  height:100%;
  background:linear-gradient(90deg,var(--green),var(--bright));
  border-radius:5px;
  transition:width .25s ease;
}
.resourcebuttons{display:flex;gap:6px;flex-wrap:wrap}

/* SKILLS */
.skill{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  margin-bottom:8px;
}
.skillgrid{display:grid;gap:8px}

/* TABS */
.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:16px;
}
.tab{
  padding:9px 16px;
  background:#141c14;
  border:1px solid var(--line);
  border-radius:8px;
  color:var(--muted);
  font-size:12.5px;
  font-weight:600;
  white-space:nowrap;
}
.tab.active,.tab:hover{
  background:var(--panel2);
  border-color:var(--green);
  color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);
}

/* STATS / ENTRIES */
.stat,.entry{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
}
.stat b{color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);font-size:18px}

/* TAGS */
.tag{
  display:inline-block;
  background:#1e2a1e;
  color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  padding:3px 8px;
  border-radius:6px;
  border:1px solid var(--line2);
}

/* DICE OUTPUT */
.diceout{
  background:#0c120c;
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px;
  text-align:center;
  margin:10px 0;
}

/* LOGIN */
#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(ellipse at center,#121a12 0%,#070a07 70%);
}
.loginbox{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:40px 36px;
  text-align:center;
  max-width:420px;
  width:90%;
  box-shadow:var(--shadow);
}
.loginbox h1{letter-spacing:4px;margin-bottom:8px}
.loginbox .btn{width:100%;margin-top:20px;padding:14px}

/* NOTIFICATIONS */
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  background:var(--panel3);
  border:1px solid var(--green);
  color:var(--bright);text-shadow:0 0 18px rgba(143,209,106,.35);
  padding:14px 18px;
  border-radius:10px;
  box-shadow:var(--shadow);
  z-index:100;
  max-width:340px;
  font-size:13.5px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* MOBILE */

/* Essential missing styles */
.hidden{display:none!important}
.diceout strong{font-size:22px;color:var(--bright)}
.resource .bar{height:12px}
.portrait-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#resources{display:flex;flex-direction:column;gap:12px}
.skill input{width:70px;text-align:center}
.entry{margin-bottom:10px}
.btnrow{margin-top:8px}


/* Floating menu button (estilo C.R.I.S.) */
.fab{
  position:fixed;
  bottom:22px;
  right:22px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  border:none;
  color:#fff;
  font-size:24px;
  box-shadow:0 4px 18px rgba(138,74,209,.45);
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.fab:hover{transform:scale(1.08)}
.fab-menu{
  position:fixed;
  bottom:90px;
  right:22px;
  background:var(--panel);
  border:1px solid var(--line2);
  border-radius:14px;
  padding:10px;
  z-index:49;
  min-width:180px;
  box-shadow:var(--shadow);
  display:none;
}
.fab-menu.open{display:block}
.fab-menu button{
  display:block;
  width:100%;
  text-align:left;
  padding:10px 12px;
  background:transparent;
  border:none;
  color:var(--text);
  border-radius:8px;
  font-size:13.5px;
}
.fab-menu button:hover{background:var(--panel2)}


.sheet-menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px 0 20px;
}
.sheet-btn{
  background:#1a1a22;
  border:1px solid var(--line2);
  color:var(--text);
  padding:12px 10px;
  border-radius:10px;
  font-size:13.5px;
  font-weight:600;
  letter-spacing:.5px;
  text-align:center;
}
.sheet-btn.active,.sheet-btn:hover{
  border-color:var(--purple);
  background:#221a2a;
  color:var(--bright);
}


.sheet-fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:52px;
  height:52px;
  border-radius:50%;
  background:#2a2a32;
  border:1px solid var(--line2);
  color:#fff;
  font-size:20px;
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.sheet-fab-menu{
  position:fixed;
  bottom:82px;
  right:20px;
  background:#1a1a22;
  border:1px solid var(--line2);
  border-radius:12px;
  padding:8px;
  z-index:39;
  min-width:160px;
  display:none;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
}
.sheet-fab-menu.open{display:block}
.sheet-fab-menu button{
  display:block;
  width:100%;
  text-align:left;
  padding:9px 12px;
  background:transparent;
  border:none;
  color:var(--text);
  border-radius:6px;
  font-size:13px;
}
.sheet-fab-menu button:hover,.sheet-fab-menu button.active{
  background:#2a2232;
  color:var(--bright);
}


/* removed */ .tabs{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:60vh;
  padding:20px;
}
/* removed */ .tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  max-width:420px;
  width:100%;
}
/* removed */ .tab{
  background:#1a1a22;
  border:1px solid var(--line2);
  color:var(--text);
  padding:22px 12px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.6px;
}
.tab:hover{
  border-color:var(--purple);
  background:#221a2a;
  color:var(--bright);
}
.write-area{
  background:#121218;
  border:1px solid var(--line);
  border-radius:10px;
  padding:16px;
  min-height:180px;
  color:var(--text);
  outline:none;
  white-space:pre-wrap;
  line-height:1.5;
}
.write-area:focus{border-color:var(--purple)}


.side-drawer{
  position:fixed;
  top:0;
  left:0;
  width:280px;
  height:100%;
  background:#111116;
  border-right:1px solid var(--line2);
  z-index:60;
  transform:translateX(-100%);
  transition:transform .25s ease;
  padding:20px 0;
  overflow-y:auto;
}
.side-drawer.open{transform:translateX(0)}
.drawer-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px 18px;
  border-bottom:1px solid var(--line);
}
.drawer-close{
  background:none;
  border:none;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}
.drawer-item{
  display:block;
  width:100%;
  text-align:left;
  padding:16px 22px;
  background:transparent;
  border:none;
  border-bottom:1px solid #222;
  color:var(--text);
  font-size:15px;
}
.drawer-item:hover{background:#1a1a22}
.drawer-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:59;
  display:none;
}
.drawer-overlay.open{display:block}
.menu-toggle{
  position:fixed;
  top:16px;
  left:16px;
  z-index:55;
  background:#1a1a22;
  border:1px solid var(--line2);
  color:#fff;
  width:42px;
  height:42px;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}


.topnav, .nav, header nav, .top-bar, .navbar {
  display: none !important;
}

}
</style>

<script>
"use strict";

// CONFIGURAÇÃO DO SUPABASE
const SUPABASE_URL = "https://rqhkrkcrjdfnzmbkulhm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3m1Yhfbm1o05tTsRG9Qmkw_8bGElEzv";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

// ===== CLOUD SYNC (Supabase) =====
async function ensureProfile(){
  if(!currentUserId) return;
  try{
    const { data } = await supabaseClient.from("profiles").select("id").eq("id", currentUserId).maybeSingle();
    if(!data){
      await supabaseClient.from("profiles").upsert({
        id: currentUserId,
        display_name: operator,
        created_at: new Date().toISOString()
      });
    } else {
      await supabaseClient.from("profiles").update({ display_name: operator }).eq("id", currentUserId);
    }
  }catch(e){ console.error("ensureProfile", e); }
}

function agentToSheet(a){
  // Guarda a ficha completa no jsonb, removendo campos que já estão nas colunas
  const copy = {...a};
  delete copy.id;
  delete copy.owner;
  return copy;
}

function sheetToAgent(row){
  const sheet = row.sheet || {};
  return {
    id: row.id,
    owner: sheet.owner_name || row.owner_name || operator,

async function loadFromCloud(){
  if(!currentUserId) return;
  try{
    // 1. Minhas fichas
    let myChars = [];
    try {
      const { data, error } = await supabaseClient.from("characters").select("*").eq("owner_id", currentUserId);
      if(error) console.error("load my chars", error);
      else myChars = data || [];
    } catch(e){ console.error(e); }

    // 2. Minhas memberships
    let memberships = [];
    try {
      const { data, error } = await supabaseClient.from("campaign_members").select("campaign_id, role").eq("user_id", currentUserId);
      if(error) console.error("load memberships", error);
      else memberships = data || [];
    } catch(e){ console.error(e); }

    // 3. Campanhas que eu criei (mestre)
    let masterCampaigns = [];
    try {
      const { data, error } = await supabaseClient.from("campaigns").select("*").eq("master_id", currentUserId);
      if(error) console.error("load master campaigns", error);
      else masterCampaigns = data || [];
    } catch(e){ console.error(e); }

    const campaignIds = [...new Set([
      ...memberships.map(m => m.campaign_id),
      ...masterCampaigns.map(c => c.id)
    ])];

    let campaigns = [];
    let sharedChars = [];
    let memberRows = [];

    if(campaignIds.length){
      // Campanhas
      try {
        const { data, error } = await supabaseClient.from("campaigns").select("*").in("id", campaignIds);
        if(error) console.error("load campaigns", error);
        else campaigns = data || [];
      } catch(e){ console.error(e); }

      // Todos os membros dessas campanhas
      try {
        const { data, error } = await supabaseClient.from("campaign_members").select("campaign_id, user_id, role").in("campaign_id", campaignIds);
        if(error) console.error("load all members", error);
        else memberRows = data || [];
      } catch(e){ console.error(e); }

      // Fichas compartilhadas
      let shares = [];
      try {
        const { data } = await supabaseClient.from("campaign_characters").select("campaign_id, character_id, shared_by").in("campaign_id", campaignIds);
        shares = data || [];
        const sharedIds = [...new Set(shares.map(s => s.character_id))];
        if(sharedIds.length){
          const { data: sc } = await supabaseClient.from("characters").select("*").in("id", sharedIds);
          sharedChars = sc || [];
        }
      } catch(e){ console.error(e); }
      window._lastShares = shares;
    }

    // Busca nomes dos usuários envolvidos
    const userIds = [...new Set([
      ...memberRows.map(m => m.user_id),
      ...campaigns.map(c => c.master_id)
    ])];
    let profiles = [];
    if(userIds.length){
      try {
        const { data } = await supabaseClient.from("profiles").select("id, display_name").in("id", userIds);
        profiles = data || [];
      } catch(e){ console.error(e); }
    }
    const nameOf = (uid) => {
      const p = profiles.find(x => x.id === uid);
      return p?.display_name || (uid === currentUserId ? operator : "Jogador");
    };

    // Monta agentes
    const agentsMap = {};
    myChars.forEach(row => { agentsMap[row.id] = sheetToAgent(row); });
    sharedChars.forEach(row => {
      if(!agentsMap[row.id]) agentsMap[row.id] = sheetToAgent(row);
    });
    // Mantém locais que ainda não foram para a nuvem e migra IDs antigos
    (db.agents || []).forEach(a => {
      if(a.owner === operator){
        migrateAgentId(a);
        if(!agentsMap[a.id]) agentsMap[a.id] = a;
      }
    });
    db.agents = Object.values(agentsMap);

    // Marca sharedCampaigns nas fichas a partir dos shares
    const sharesByChar = {};
    (window._lastShares || []).forEach(s => {
      if(!sharesByChar[s.character_id]) sharesByChar[s.character_id] = [];
      if(!sharesByChar[s.character_id].includes(s.campaign_id)) sharesByChar[s.character_id].push(s.campaign_id);
    });
    db.agents.forEach(a => {
      a.sharedCampaigns = sharesByChar[a.id] || a.sharedCampaigns || [];
    });

    // Monta campanhas com membros reais
    const allCampsMap = {};
    campaigns.forEach(c => { allCampsMap[c.id] = c; });
    masterCampaigns.forEach(c => { allCampsMap[c.id] = c; });

    db.campaigns = Object.values(allCampsMap).map(c => {
      const mems = memberRows.filter(m => m.campaign_id === c.id).map(m => ({
        id: m.user_id,
        name: nameOf(m.user_id),
        role: m.role
      }));
      // Garante que o mestre está na lista
      if(!mems.some(m => m.id === c.master_id)){
        mems.unshift({ id: c.master_id, name: nameOf(c.master_id), role: "master" });
      }
      return {
        id: c.id,
        name: c.name,
        system: c.system || "",
        description: c.description || "",
        master: nameOf(c.master_id),
        master_id: c.master_id,
        members: mems,
        invite: c.invite_code,
        status: "Em andamento",
        created: c.created_at
      };
    });

    cloudDataLoaded = true;
    saveDB();
    console.log("Cloud loaded:", db.agents.length, "agents,", db.campaigns.length, "campaigns");
  }catch(e){
    console.error("loadFromCloud error", e);
  }
}

async function joinCampaignByCode(code){
  if(!currentUserId) return notify("Faça login primeiro");
  code = (code || "").trim().toUpperCase();
  if(!code) return notify("Digite o código");

  try{
    const { data: camp, error } = await supabaseClient
      .from("campaigns")
      .select("*")
      .eq("invite_code", code)
      .maybeSingle();

    if(error || !camp) return notify("Convite inválido ou campanha não encontrada");

    // Já é membro?
    const { data: existing } = await supabaseClient
      .from("campaign_members")
      .select("user_id")
      .eq("campaign_id", camp.id)
      .eq("user_id", currentUserId)
      .maybeSingle();

    if(existing) return notify("Você já participa desta campanha");

    const { error: e2 } = await supabaseClient.from("campaign_members").insert({
      campaign_id: camp.id,
      user_id: currentUserId,
      role: "player",
      joined_at: new Date().toISOString()
    });
    if(e2){
      console.error("join insert error:", e2);
      return notify("Erro ao entrar: " + (e2.message || JSON.stringify(e2)));
    }

    // Add immediately to local db so it appears right away
    if(!db.campaigns.some(c => c.id === camp.id)){
      db.campaigns.push({
        id: camp.id,
        name: camp.name,
        system: camp.system || "",
        description: camp.description || "",
        master: "Mestre",
        master_id: camp.master_id,
        members: [operator],
        invite: camp.invite_code,
        status: "Em andamento",
        created: camp.created_at
      });
      saveDB();
    }

    await loadFromCloud();
    render();
    notify("Entrou na campanha: " + camp.name);
  }catch(e){
    console.error(e);
    notify("Erro ao entrar na campanha");
  }
}

function uid(){return crypto.randomUUID()}

function isValidUUID(str){
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(str || "");
}

function ensureUUID(oldId){
  if(isValidUUID(oldId)) return oldId;
  // Gera um UUID estável a partir do id antigo (para não perder referência)
  const hash = Array.from(oldId || "").reduce((a,c) => ((a<<5)-a)+c.charCodeAt(0), 0);
  const hex = Math.abs(hash).toString(16).padStart(8,"0").slice(0,8);
  return crypto.randomUUID(); // sempre novo para evitar colisão
}

function migrateAgentId(agent){
  if(!agent || isValidUUID(agent.id)) return agent;
  const newId = crypto.randomUUID();
  console.log("Migrando ficha", agent.id, "→", newId);
  agent.id = newId;
  return agent;
}

// Converte a ficha para um token seguro para URL.
function encodePublicSheet(agent){
  const bytes=new TextEncoder().encode(JSON.stringify(agent));
  let binary="";
  for(let i=0;i<bytes.length;i++)binary+=String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodePublicSheet(token){
  const base64=token.replace(/-/g,"+").replace(/_/g,"/");
  const padded=base64+"=".repeat((4-base64.length%4)%4);
  const binary=atob(padded);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

function setAttribute(id,aid,v){
 const a=findAgent(id);
 if(!a)return;
 const x=a.attributes.find(z=>z.id===aid);
 if(!x)return;
 const textValue=String(v).trim();
 if(textValue===""){x.value=0}else{
  const n=Number(textValue);
  if(!Number.isFinite(n))return;
  x.value=Math.max(0,Math.floor(n));
 }
 const saved=saveDB();
 // Salva na nuvem imediatamente
 if(currentUserId && a.owner===operator){
  saveCharacterToCloud(a).then(ok=>{
    const status=document.getElementById("saved_"+aid);
    if(status){
      status.textContent=ok?"● SALVO NA NUVEM":"● SALVO LOCAL";
      status.style.color=ok?"var(--green)":"var(--muted)";
    }
  });
 }
 const status=document.getElementById("saved_"+aid);
 if(status && !currentUserId){
  status.textContent=saved?"● SALVO NO DISPOSITIVO":"● FALHA AO SALVAR";
  status.style.color=saved?"var(--green)":"var(--red)";
 }
}

/* CAMPANHAS */
function campaignCode(){return "ZK-"+Math.random().toString(36).slice(2,8).toUpperCase()}
function getCampaign(id){return db.campaigns.find(c=>c.id===id)}
function isMember(c){
  if(!c || !Array.isArray(c.members)) return false;
  return c.members.some(m => (typeof m === "string" ? m === operator : m.id === currentUserId || m.name === operator));
}
function isMaster(c){
  if(!c) return false;
  if(c.master_id) return c.master_id === currentUserId;
  return c.master === operator;
}
function renderCampaigns(root){const mine=db.campaigns.filter(isMember),shared=db.agents.filter(a=>a.owner!==operator&&(a.sharedWith||[]).includes(operator));root.innerHTML=heading("CAMPANHAS","Mesas privadas, personagens e gerenciamento.",'<button class="btn" onclick="addCampaign()">＋ NOVA CAMPANHA</button>')+`<div class="panel"><h2>ENTRAR EM UMA CAMPANHA</h2><label>Código do convite</label><input id="campaignInviteInput" placeholder="Ex.: ZK-ABC123"><button class="btn" style="margin-top:10px" onclick="joinCampaign()">ENTRAR PELO CONVITE</button></div><div class="panel"><h2>MINHAS CAMPANHAS</h2>${mine.length?mine.map(c=>`<div class="agent"><div class="agenttitle">${esc(c.name)}</div><div class="muted">${esc(c.system)} • ${c.members.length} participante(s) • ${isMaster(c)?"VOCÊ É O MESTRE":"JOGADOR"}</div><button class="btn" style="margin-top:10px" onclick="openCampaign('${c.id}')">ABRIR CAMPANHA</button></div>`).join(""):'<div class="empty">Você ainda não participa de campanhas.</div>'}</div><div class="panel"><h2>FICHAS COMPARTILHADAS COMIGO</h2>${shared.length?shared.map(a=>`<div class="entry"><b>${esc(a.name)}</b><div class="muted">Proprietário: ${esc(a.owner)}</div><button class="btn sm" onclick="viewCampaignAgent('${a.id}')">VISUALIZAR FICHA</button></div>`).join(""):'<div class="empty">Nenhuma ficha compartilhada individualmente.</div>'}</div>${renderMyRequests()}`}
function addCampaign(){const name=prompt("Nome da campanha:");if(!name||!name.trim())return;const system=prompt("Sistema:","Sistema próprio");if(system===null)return;const description=prompt("Descrição:","");if(description===null)return;const c={id:uid(),name:name.trim(),system:system.trim(),description,master:operator,master_id:currentUserId,members:[operator],invite:campaignCode(),status:"Em andamento",created:new Date().toISOString()};db.campaigns.push(c);if(!saveDB()){db.campaigns.pop();return}createCampaignInCloud(c).then(ok=>{if(ok)notify("Campanha criada e salva na nuvem!");else notify("Campanha criada localmente");render();});}
function joinCampaign(){const code=document.getElementById("campaignInviteInput")?.value;joinCampaignByCode(code);}
function openCampaign(id){const c=getCampaign(id);if(!c||!isMember(c))return notify("Campanha não encontrada.");const master=isMaster(c),members=(c.members||[]).map(m=>{
  const name = typeof m === "string" ? m : (m.name || "Jogador");
  const role = typeof m === "string" ? (m===c.master?"master":"player") : (m.role || "player");
  const count = db.agents.filter(a => (a.owner===name || a.owner_id===m.id) && (a.sharedCampaigns||[]).includes(c.id)).length;
  return `<div class="entry"><b>${esc(name)}</b> <span class="tag">${role==="master"?"MESTRE":"JOGADOR"}</span><div class="muted">${count} personagem(ns) compartilhado(s)</div>${master && name!==operator ? `<button class="btn red sm" onclick="removeCampaignMember('${c.id}','${encodeURIComponent(name)}')">REMOVER</button>` : ""}</div>`;
}).join(""),shared=db.agents.filter(a=>(a.sharedCampaigns||[]).includes(c.id)),own=db.agents.filter(a=>a.owner===operator);document.getElementById("main").innerHTML=`<div class="heading"><div><button class="btn gray sm" onclick="render()">← VOLTAR</button><h1 style="margin-top:12px">${esc(c.name)}</h1><div class="sub">${esc(c.system)} • ${esc(c.description)}</div></div>${master?'<span class="tag">MESTRE DA CAMPANHA</span>':''}</div><div class="panel"><h2>CONVITE PRIVADO</h2><div class="diceout"><strong style="font-size:25px">${esc(c.invite)}</strong><div class="muted">Compartilhe este código com os jogadores.</div></div><div class="btnrow"><button class="btn" onclick="copyCampaignInvite('${c.id}')">COPIAR CONVITE</button>${master?`<button class="btn gray" onclick="regenerateCampaignInvite('${c.id}')">GERAR NOVO CÓDIGO</button>`:""}</div></div><div class="panel"><h2>PARTICIPANTES (${c.members.length})</h2>${members}</div><div class="panel"><h2>FICHAS COMPARTILHADAS COM A CAMPANHA</h2>${shared.length?shared.map(a=>`<div class="agent"><div class="agenttitle">${esc(a.name)}</div><div class="muted">Jogador: ${esc(a.owner)}</div><div class="btnrow" style="margin-top:9px"><button class="btn sm" onclick="viewCampaignAgent('${a.id}')">VISUALIZAR FICHA</button>${master&&a.owner!==operator?`<button class="btn sm gray" onclick="requestMasterEdit('${a.id}')">SOLICITAR EDIÇÃO</button>`:""}${a.owner===operator?`<button class="btn sm red" onclick="unshareCampaignAgent('${a.id}','${c.id}')">RETIRAR FICHA</button>`:""}</div></div>`).join(""):'<div class="empty">Nenhum personagem foi compartilhado.</div>'}</div><div class="panel"><h2>MEUS PERSONAGENS</h2><div class="muted">Você pode criar personagens ilimitados e escolher quais aparecem nesta campanha.</div>${own.length?own.map(a=>`<div class="entry"><b>${esc(a.name)}</b><div class="muted">${(a.sharedCampaigns||[]).includes(c.id)?"Compartilhada com esta campanha":"Privada nesta campanha"}</div><button class="btn sm" onclick="toggleCampaignShare('${a.id}','${c.id}')">${(a.sharedCampaigns||[]).includes(c.id)?"RETIRAR COMPARTILHAMENTO":"COMPARTILHAR COM CAMPANHA"}</button></div>`).join(""):'<div class="empty">Você ainda não criou personagens.</div>'}<button class="btn" onclick="newAgent()">＋ CRIAR PERSONAGEM</button></div>${master?`<div class="panel"><h2>PAINEL DO MESTRE</h2><p class="muted">Você pode visualizar fichas compartilhadas. Para editar, precisa da autorização do jogador.</p>${renderMasterRequests(c.id)}<hr><button class="btn red" onclick="deleteCampaign('${c.id}')">EXCLUIR CAMPANHA</button></div>`:""}`}
function toggleCampaignShare(aid,cid){const a=findAgent(aid),c=getCampaign(cid);if(!a||!c||a.owner!==operator||!isMember(c))return;a.sharedCampaigns=a.sharedCampaigns||[];const was=a.sharedCampaigns.includes(cid);a.sharedCampaigns=was?a.sharedCampaigns.filter(x=>x!==cid):[...a.sharedCampaigns,cid];saveDB();if(was)unshareCharacterFromCampaign(aid,cid);else shareCharacterToCampaign(aid,cid);openCampaign(cid)}
function unshareCampaignAgent(aid,cid){const a=findAgent(aid);if(!a||a.owner!==operator)return;a.sharedCampaigns=(a.sharedCampaigns||[]).filter(x=>x!==cid);saveDB();openCampaign(cid)}

/* COMPARTILHAMENTO PÚBLICO POR LINK */
function shareAgentMenu(id){
  const a=findAgent(id);
  if(!a||a.owner!==operator)return notify("Somente o proprietário pode compartilhar.");

  try{
    const token=encodePublicSheet(a);
    const url=location.origin+location.pathname+"#ficha="+token;

    if(url.length>180000){
      return notify("A ficha ficou grande demais para compartilhar. Tente remover a imagem.");
    }

    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url)
        .then(()=>notify("LINK COPIADO! Envie para seu amigo."))
        .catch(()=>prompt("Copie o link público da ficha:",url));
    }else{
      prompt("Copie o link público da ficha:",url);
    }
  }catch(error){
    console.error("Erro ao criar link público:",error);
    notify("Não foi possível criar o link.");
  }
}

function viewCampaignAgent(id){const a=findAgent(id);if(!a)return;const own=a.owner===operator,individual=(a.sharedWith||[]).includes(operator),campaign=db.campaigns.some(c=>isMember(c)&&(a.sharedCampaigns||[]).includes(c.id));if(!own&&!individual&&!campaign)return notify("Você não tem acesso.");if(canEditAgent(id)){openAgent(id);return}const list=(arr)=>arr.map(x=>`<div class="entry">${esc(x.name)}: <b>${Number(x.value)}</b></div>`).join("");document.getElementById("main").innerHTML=`<button class="btn gray" onclick="render()">← VOLTAR</button><div class="character-header" style="margin-top:15px"><div class="portrait large">${a.image?`<img src="${a.image}" alt="Personagem">`:"SEM FOTO"}</div><div><h1>${esc(a.name)}</h1><div class="sub">${esc(a.className)} • ${esc(a.system)}</div><div class="muted">Proprietário: ${esc(a.owner)}</div><span class="tag">SOMENTE VISUALIZAÇÃO</span></div></div><div class="panel"><h2>RECURSOS</h2>${a.resources.map(r=>`<div class="entry">${esc(r.name)}: ${r.current}/${r.max}</div>`).join("")}</div><div class="panel"><h2>ATRIBUTOS</h2>${list(a.attributes)}</div><div class="panel"><h2>PERÍCIAS</h2>${list(a.skills)}</div><div class="panel"><h2>HABILIDADES</h2>${a.abilities.map(h=>`<div class="entry"><b>${esc(h.name)}</b><p class="muted">${esc(h.description)}</p></div>`).join("")||"Nenhuma habilidade."}</div><div class="panel"><h2>INVENTÁRIO</h2>${a.inventory.map(it=>`<div class="entry">${esc(it.name)} × ${it.quantity}</div>`).join("")||"Inventário vazio."}</div><div class="panel"><h2>HISTÓRIA</h2><p class="muted">${esc(a.story)}</p></div>${!own?`<button class="btn" onclick="requestIndividualEdit('${a.id}')">SOLICITAR AUTORIZAÇÃO DE EDIÇÃO</button>`:""}`}
function requestMasterEdit(aid){const a=findAgent(aid);if(!a||a.owner===operator)return;const c=db.campaigns.find(x=>isMaster(x)&&isMember(x)&&(a.sharedCampaigns||[]).includes(x.id));if(!c)return notify("Ficha não compartilhada com sua campanha.");if(db.requests.some(r=>r.character===aid&&r.master===operator&&r.status==="pending"))return notify("Solicitação já enviada.");db.requests.push({id:uid(),character:aid,owner:a.owner,master:operator,campaign:c.id,status:"pending",created:new Date().toISOString()});saveDB();notify("Solicitação enviada ao jogador.");openCampaign(c.id)}
function requestIndividualEdit(aid){const a=findAgent(aid);if(!a||a.owner===operator)return;if(db.requests.some(r=>r.character===aid&&r.master===operator&&r.status==="pending"))return notify("Solicitação já enviada.");db.requests.push({id:uid(),character:aid,owner:a.owner,master:operator,campaign:null,status:"pending",created:new Date().toISOString()});saveDB();notify("Solicitação enviada.");renderCampaigns(document.getElementById("main"))}
function renderMasterRequests(cid){const rs=db.requests.filter(r=>r.master===operator&&r.campaign===cid&&r.status==="pending");return rs.map(r=>`<div class="entry">${esc(findAgent(r.character)?.name||"Personagem")} — aguardando autorização do jogador.</div>`).join("")||'<div class="empty">Nenhuma solicitação pendente.</div>'}
function renderMyRequests(){const rs=db.requests.filter(r=>r.owner===operator&&r.status==="pending");if(!rs.length)return "";return `<div class="panel"><h2>SOLICITAÇÕES DE EDIÇÃO RECEBIDAS</h2>${rs.map(r=>`<div class="entry"><b>${esc(r.master)}</b> deseja editar <b>${esc(findAgent(r.character)?.name||"Personagem")}</b>.<div class="btnrow"><button class="btn sm" onclick="answerEditRequest('${r.id}',true)">AUTORIZAR</button><button class="btn red sm" onclick="answerEditRequest('${r.id}',false)">RECUSAR</button></div></div>`).join("")}</div>`}
function answerEditRequest(id,ok){const r=db.requests.find(x=>x.id===id);if(!r||r.owner!==operator)return;r.status=ok?"approved":"denied";saveDB();render();notify(ok?"Edição autorizada!":"Solicitação recusada.")}
function copyCampaignInvite(id){const c=getCampaign(id);if(!c||!isMember(c))return;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(c.invite).then(()=>notify("Convite copiado!")).catch(()=>prompt("Copie o código:",c.invite));else prompt("Copie o código:",c.invite)}
function regenerateCampaignInvite(id){const c=getCampaign(id);if(!c||!isMaster(c))return;if(!confirm("O código antigo deixará de funcionar. Continuar?"))return;c.invite=campaignCode();saveDB();openCampaign(id);notify("Novo convite gerado!")}
function removeCampaignMember(id,encoded){const c=getCampaign(id),name=decodeURIComponent(encoded);if(!c||!isMaster(c)||name===c.master)return;if(!confirm("Remover jogador?"))return;c.members=c.members.filter(x=>x!==name);saveDB();openCampaign(id)}
async function deleteCampaign(id){const c=getCampaign(id);if(!c||!isMaster(c))return notify("Somente o mestre pode excluir.");if(!confirm("Excluir campanha?"))return;db.campaigns=db.campaigns.filter(x=>x.id!==id);db.agents.forEach(a=>a.sharedCampaigns=(a.sharedCampaigns||[]).filter(x=>x!==id));db.requests=db.requests.filter(r=>r.campaign!==id);saveDB();
  try{
    await supabaseClient.from("campaign_members").delete().eq("campaign_id", id);
    await supabaseClient.from("campaign_characters").delete().eq("campaign_id", id);
    const { error } = await supabaseClient.from("campaigns").delete().eq("id", id).eq("master_id", currentUserId);
    if(error) console.error("delete campaign cloud", error);
    else notify("Campanha excluída");
  }catch(e){ console.error(e); notify("Excluída localmente (erro na nuvem)"); }
  render();
}
function deleteAgent(id){const a=findAgent(id);if(!a||a.owner!==operator)return notify("Somente o proprietário pode excluir.");if(!confirm("Excluir esta ficha?"))return;db.agents=db.agents.filter(x=>x.id!==id);db.requests=db.requests.filter(r=>r.character!==id);saveDB();deleteCharacterFromCloud(id);selected=null;page="agents";render();notify("Ficha excluída")}
function downloadJSON(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportOne(id){const a=findAgent(id);if(a)downloadJSON(a,"ZIKYS_"+a.name.replace(/[^a-z0-9]/gi,"_")+".json")}
function renderBackup(root){root.innerHTML=heading("BACKUP E ARQUIVOS","Proteja suas fichas.")+`<div class="panel"><h2>EXPORTAR TUDO</h2><p class="muted">Baixe fichas, imagens, campanhas, solicitações e rolagens.</p><button class="btn" onclick="downloadJSON(db,'ZIKYS_BACKUP.json')">↓ EXPORTAR BACKUP</button><hr><h2>IMPORTAR BACKUP</h2><p class="muted">A importação substitui os dados atuais. Faça um backup antes.</p><input id="backupFile" type="file" accept=".json,application/json"><button class="btn gray" style="margin-top:10px" onclick="importBackup()">IMPORTAR</button></div><div class="panel"><h2>ARMAZENAMENTO</h2><div class="muted">As fichas ficam no navegador deste dispositivo nesta versão.</div></div>`}
function importBackup(){const f=document.getElementById("backupFile").files[0];if(!f)return notify("Escolha um arquivo.");const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.agents)||!Array.isArray(d.campaigns)||!Array.isArray(d.rolls))throw Error();d.requests=Array.isArray(d.requests)?d.requests:[];if(!confirm("Substituir os dados atuais pelo backup?"))return;const old=db;db=d;if(!saveDB()){db=old;return}db.agents.forEach(a=>{a.owner=a.owner||operator;a.sharedCampaigns=a.sharedCampaigns||[];a.sharedWith=a.sharedWith||[]});selected=null;lastRoll=null;render();notify("Backup importado!")}catch(e){notify("Arquivo inválido.")}};rd.readAsText(f)}
function renderSettings(root){root.innerHTML=heading("CONFIGURAÇÕES","Informações do terminal.")+`<div class="panel"><h2>OPERADOR</h2><div class="muted">Identificação atual: ${esc(operator)}</div><button class="btn gray" style="margin-top:10px" onclick="changeOperator()">ALTERAR NOME</button></div><div class="panel"><h2>ESTADO DO SISTEMA</h2><div class="muted">Fichas: ${db.agents.length}<br>Campanhas: ${db.campaigns.length}<br>Rolagens: ${db.rolls.length}</div></div><div class="panel"><h2>INFORMAÇÃO IMPORTANTE</h2><div class="muted">Esta versão ainda funciona localmente. O nome do operador não é uma conta protegida por senha. Para compartilhar campanhas entre celulares e computadores, será necessário conectar um banco de dados online.</div></div><div class="panel"><button class="btn red" onclick="resetAll()">APAGAR TODOS OS DADOS</button></div>`}
function changeOperator(){const n=prompt("Novo nome:",operator);if(!n||!n.trim())return;operator=n.trim();localStorage.setItem(USERKEY,operator);document.getElementById("operatorName").textContent="OPERADOR: "+operator.toUpperCase();render()}
function resetAll(){if(!confirm("Apagar todas as fichas, campanhas e rolagens?"))return;if(!confirm("Esta ação não pode ser desfeita. Continuar?"))return;db={agents:[],campaigns:[],rolls:[],requests:[]};saveDB();selected=null;lastRoll=null;render();notify("Dados apagados.")}

/* EXIBE A FICHA PÚBLICA SEM EXIGIR LOGIN */
function showPublicSheet(){
  const match=location.hash.match(/^#ficha=(.+)$/);
  if(!match)return false;

  try{
    const a=decodePublicSheet(match[1]);
    if(!a||typeof a!=="object"||!a.name)throw new Error("Ficha inválida");

    const arr=v=>Array.isArray(v)?v:[];
    const list=items=>arr(items).map(x=>`
      <div class="entry">
        ${esc(x.name)}: <b>${esc(x.value??"")}</b>
      </div>
    `).join("")||'<div class="empty">Nenhum registro.</div>';

    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    document.querySelector(".layout").innerHTML=`
      <main class="main">
        <div class="heading">
          <div>
            <div class="logo">ZIKYS</div>
            <div class="sub">FICHA COMPARTILHADA</div>
          </div>
          <span class="tag">SOMENTE VISUALIZAÇÃO</span>
        </div>

        <div class="character-header">
          <div class="portrait large">
            ${a.image?`<img src="${esc(a.image)}" alt="Personagem">`:"SEM FOTO"}
          </div>
          <div>
            <h1>${esc(a.name)}</h1>
            <div class="sub">${esc(a.className||"")} • ${esc(a.system||"")}</div>
            <div class="muted">Nível: ${esc(a.level||"—")} • Idade: ${esc(a.age||"—")}</div>
            <div class="tag">VISUALIZAÇÃO PÚBLICA</div>
          </div>
        </div>

        <div class="panel">
          <h2>IDENTIFICAÇÃO</h2>
          <div class="muted">Descrição</div>
          <p>${esc(a.description||"Sem descrição.")}</p>
        </div>

        <div class="grid">
          ${arr(a.resources).map(r=>`
            <div class="resource">
              <div class="resourcehead">
                <strong>${esc(r.name)}</strong>
                <span>${esc(r.current)} / ${esc(r.max)}</span>
              </div>
              <div class="bar">
                <div class="fill" style="width:${Number(r.max)>0?Math.max(0,Math.min(100,100*Number(r.current)/Number(r.max))):0}%"></div>
              </div>
            </div>
          `).join("")}
        </div>

        <div class="panel">
          <h2>ATRIBUTOS</h2>
          ${list(a.attributes)}
        </div>

        <div class="panel">
          <h2>PERÍCIAS</h2>
          ${list(a.skills)}
        </div>

        <div class="panel">
          <h2>HABILIDADES</h2>
          ${arr(a.abilities).map(h=>`
            <div class="entry">
              <b>${esc(h.name)}</b>
              <p class="muted">${esc(h.description||"")}</p>
              <div class="muted">
                Categoria: ${esc(h.category||"—")} •
                Custo: ${esc(h.cost||"—")} •
                Ação: ${esc(h.action||"—")} •
                Alcance: ${esc(h.range||"—")} •
                Duração: ${esc(h.duration||"—")}<br>
                Requisitos: ${esc(h.requirements||"—")}
              </div>
            </div>
          `).join("")||'<div class="empty">Nenhuma habilidade.</div>'}
        </div>

        <div class="panel">
          <h2>INVENTÁRIO</h2>
          ${arr(a.inventory).map(it=>`
            <div class="entry">
              <b>${esc(it.name)}</b> × ${esc(it.quantity)}
              <div class="muted">
                ${esc(it.type||"")} • ${esc(it.description||"")} •
                Peso: ${esc(it.weight||"—")} •
                Efeito: ${esc(it.effect||"—")}
              </div>
            </div>
          `).join("")||'<div class="empty">Inventário vazio.</div>'}
        </div>

        <div class="panel">
          <h2>HISTÓRIA</h2>
          <p>${esc(a.story||"Sem história cadastrada.")}</p>
        </div>

        <div class="panel">
          <h2>ANOTAÇÕES</h2>
          <p>${esc(a.notes||"Sem anotações.")}</p>
        </div>

        <div class="panel">
          <h2>PERSONALIZAÇÃO</h2>
          <div class="muted">Elementos: ${esc(a.elements||"—")}</div>
          <p>${esc(a.rules||"")}</p>
        </div>

        <div class="muted" style="text-align:center;padding:20px">
          Ficha compartilhada pelo ZIKYS RPG
        </div>
      </main>
    `;

    document.getElementById("operatorName").textContent="FICHA PÚBLICA";
    return true;

  }catch(error){
    console.error("Erro ao abrir ficha pública:",error);
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
    notify("Link inválido ou ficha corrompida.");
    return true;
  }
}


// Force cloud save when user leaves or hides the tab
window.addEventListener("beforeunload", () => {
  if(selected && currentUserId){
    const a = findAgent(selected);
    if(a && a.owner === operator){
      // Best-effort synchronous-ish save
      navigator.sendBeacon && navigator.sendBeacon("/noop"); // just to keep page alive briefly
      saveCharacterToCloud(a);
    }
  }
});
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden" && selected && currentUserId){
    const a = findAgent(selected);
    if(a && a.owner === operator) saveCharacterToCloud(a);
  }
});

(async function initZikys(){
  // A ficha pública abre antes da verificação de login.
  if(showPublicSheet())return;

  const { data, error } = await supabaseClient.auth.getSession();

  if(error){
    console.error("Erro ao verificar sessão:", error);
    notify("Erro ao conectar com a autenticação.");
    return;
  }

  if(data.session){
    start(data.session.user);
  }else{
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }

  supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(session && event === "SIGNED_IN"){
      start(session.user);
    }
  });
})();
</script>
