
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101610">
<title>ZIKYS RPG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090d09;--panel:#121a12;--panel2:#192319;--line:#303d2d;--green:#a5c879;--bright:#c5e69a;--muted:#8d9b87;--red:#c86d65;--text:#e9eee5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.top{height:65px;background:#101610;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:900;letter-spacing:5px;color:var(--bright)}.logo small{display:block;font-size:8px;letter-spacing:3px;color:var(--muted);margin-top:3px}.operator{font-size:11px;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 65px)}.sidebar{background:#0e130e;border-right:1px solid var(--line);padding:15px 10px}.navtitle{font-size:9px;letter-spacing:2px;color:#64705f;margin:16px 10px 8px}.nav{display:block;width:100%;text-align:left;padding:12px;background:transparent;border:1px solid transparent;border-radius:7px;color:#aab5a4;margin:3px 0}.nav.active,.nav:hover{background:#202d1d;border-color:#43583a;color:var(--bright)}
.main{padding:24px;max-width:1450px;width:100%;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}h1{font-size:25px;margin:0 0 5px}h2{font-size:17px;margin:0 0 14px}h3{font-size:13px;color:var(--bright)}.sub,.muted{font-size:11px;color:var(--muted);line-height:1.5}
.panel,.agent,.resource,.entry,.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px}.panel{margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{text-align:center}.stat strong{font-size:25px;color:var(--bright);display:block}.stat span{font-size:9px;color:var(--muted);letter-spacing:1px}
.btn{background:#293b23;border:1px solid #536e43;color:var(--bright);padding:9px 13px;border-radius:6px;font-size:11px;font-weight:bold}.btn:hover{background:#3b512e}.btn.gray{background:#1a2119;border-color:var(--line);color:#c2cbbb}.btn.red{background:#351e1c;border-color:#75443f;color:#e69b93}.btn.sm{padding:6px 9px;font-size:10px}.btnrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
label{font-size:10px;color:#aeb9a7;display:block;margin:10px 0 5px}input,textarea,select{width:100%;background:#0b110b;color:var(--text);border:1px solid #354332;border-radius:6px;padding:10px;outline:none;min-width:0}input:focus,textarea:focus,select:focus{border-color:var(--green)}textarea{min-height:100px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.resource{padding:12px}.resourcehead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.resourcehead strong{font-size:12px;color:var(--bright)}.resourcehead span{font-size:11px;color:var(--muted)}.bar{height:8px;background:#303a2e;border-radius:20px;overflow:hidden;margin:8px 0}.fill{height:100%;background:var(--green);transition:width .2s}.resourcefields{display:grid;grid-template-columns:1fr 1fr;gap:7px}.resourcefields input{padding:7px;font-size:11px}.resourcebuttons{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:10px;margin:17px 0}.tab{white-space:nowrap;background:#131a12;color:#aab5a4;border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:11px}.tab.active{background:#293b23;border-color:#647f4c;color:var(--bright)}
.agent{margin-bottom:10px}.agenttitle{font-weight:bold;color:var(--bright);font-size:16px}.tag{font-size:9px;border:1px solid #506744;border-radius:20px;color:var(--bright);padding:4px 8px}.skillgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.skill{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#172017;border:1px solid var(--line);border-radius:7px;padding:9px}.skill strong{font-size:11px}.skill input{width:65px;padding:6px;text-align:center}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;font-size:12px}hr{border:0;border-top:1px solid var(--line);margin:15px 0}.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(410px,100%);background:var(--panel);border:1px solid var(--line);padding:28px;border-radius:13px}.loginbox .logo{text-align:center;font-size:39px}.loginbox p{text-align:center;color:var(--muted);font-size:11px;line-height:1.6}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;background:#263923;border:1px solid #6b8954;color:var(--bright);padding:12px 18px;border-radius:8px;font-size:12px}.statusline{font-size:10px;color:var(--green);margin-top:7px}.diceout{padding:20px;text-align:center;background:#1b2819;border:1px solid #526d42;border-radius:9px;margin-top:12px}.diceout strong{display:block;font-size:42px;color:var(--bright)}
.character-header{display:flex;gap:18px;align-items:center;background:linear-gradient(120deg,#1b2819,#101610);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:15px}.portrait{width:125px;height:145px;flex-shrink:0;border:1px solid #536e43;border-radius:9px;background:#0b110b;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px;text-align:center}.portrait img{width:100%;height:100%;object-fit:cover}.portrait.large{width:145px;height:165px}.portrait-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}#imageInput{display:none}.roll-output{margin-bottom:14px}.roll-output .panel{border-color:#718e53}.roll-output .diceout{margin-top:8px}.entrytop{display:flex;justify-content:space-between;align-items:center;gap:10px}.entryname{font-weight:bold;color:var(--bright)}
@media(max-width:750px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow-x:auto;padding:7px;position:sticky;top:65px;z-index:8;border-right:0;border-bottom:1px solid var(--line)}.navtitle{display:none}.nav{width:auto;white-space:nowrap;margin:0 2px;padding:10px;font-size:10px}.main{padding:14px}.grid,.grid3{grid-template-columns:1fr}.skillgrid{grid-template-columns:1fr}h1{font-size:21px}.character-header{align-items:flex-start}.portrait{width:100px;height:125px}}
</style>
</head>
<body>
<section id="login">
  <div class="loginbox">
    <div class="logo">ZIKYS</div>
    <p>RPG MANAGEMENT SYSTEM<br>TERMINAL DE ACESSO</p>
    <button class="btn" style="width:100%;margin-top:20px" onclick="enterSystem()">ENTRAR COM GOOGLE</button>
    <p style="margin-top:15px;font-size:11px">ACESSO AUTENTICADO E SEGURO</p>
  </div>
</section>
<div id="app" class="hidden"><header class="top"><div class="logo">ZIKYS<small>RPG MANAGEMENT SYSTEM</small></div><div class="operator" id="operatorName"></div></header><div class="layout"><aside class="sidebar"><div class="navtitle">TERMINAL</div><button class="nav active" data-page="home">⌂ &nbsp; INÍCIO</button><button class="nav" data-page="agents">◈ &nbsp; AGENTES</button><button class="nav" data-page="dice">⚄ &nbsp; DADOS</button><div class="navtitle">GERENCIAMENTO</div><button class="nav" data-page="campaigns">▤ &nbsp; CAMPANHAS</button><button class="nav" data-page="backup">⇅ &nbsp; BACKUP</button><button class="nav" data-page="settings">⚙ &nbsp; CONFIGURAÇÕES</button></aside><main class="main" id="main"></main></div></div>
<div id="toast" class="toast hidden"></div>
<script>
"use strict";

// CONFIGURAÇÃO DO SUPABASE
const SUPABASE_URL = "https://rqhkrkcrjdfnzmbkulhm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3m1Yhfbm1o05tTsRG9Qmkw_8bGElEzv";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

// CONFIGURAÇÃO DO ZIKYS
const DBKEY="ZIKYS_DATABASE_V4",USERKEY="ZIKYS_OPERATOR";
const DEFAULT_SKILLS=["Acrobacia","Adestramento","Artes","Atletismo","Atualidades","Ciências","Crime","Diplomacia","Enganação","Fortitude","Furtividade","Iniciativa","Intimidação","Intuição","Investigação","Luta","Medicina","Ocultismo","Percepção","Pilotagem","Pontaria","Profissão","Reflexos","Religião","Sobrevivência","Tática","Tecnologia","Vontade"];
let db={agents:[],campaigns:[],rolls:[],requests:[]},operator=localStorage.getItem(USERKEY)||"",currentUserId=null,page="home",selected=null,tab="geral",lastRoll=null;
function loadDB(){try{const p=JSON.parse(localStorage.getItem(DBKEY)||"{}");db={agents:Array.isArray(p.agents)?p.agents:[],campaigns:Array.isArray(p.campaigns)?p.campaigns:[],rolls:Array.isArray(p.rolls)?p.rolls:[],requests:Array.isArray(p.requests)?p.requests:[]};db.agents.forEach(a=>{a.attributes=a.attributes||[];a.skills=a.skills||[];a.resources=a.resources||[];a.abilities=a.abilities||[];a.inventory=a.inventory||[];a.owner=a.owner||operator;a.sharedCampaigns=a.sharedCampaigns||[];a.sharedWith=a.sharedWith||[]});db.campaigns.forEach(c=>{c.members=c.members||[c.master||operator];c.master=c.master||operator;c.invite=c.invite||campaignCode()})}catch(e){console.error(e)}}
function saveDB(){
 try{
  const snapshot=JSON.stringify(db);
  localStorage.setItem(DBKEY,snapshot);
  const verification=localStorage.getItem(DBKEY);
  if(verification!==snapshot)throw new Error("A verificação do armazenamento falhou.");
  return true;
 }catch(e){
  console.error("Erro ao salvar o ZIKYS:",e);
  alert("Não foi possível confirmar o salvamento no navegador. Exporte um backup e verifique se armazenamento do navegador está permitido.");
  return false;
 }
}
function uid(){return "zk_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function notify(s){const t=document.getElementById("toast");t.textContent=s;t.classList.remove("hidden");clearTimeout(window.zkToastTimer);window.zkToastTimer=setTimeout(()=>t.classList.add("hidden"),2500)}
async function enterSystem(){
  const { data, error } = await supabaseClient.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: window.location.origin
    }
  });
  if (error) notify("Erro no login: " + error.message);
}
function start(user){
  if(!user) return;
  currentUserId = user.id;
  operator = user.user_metadata?.full_name || user.user_metadata?.name || user.email || "Jogador";
  localStorage.setItem(USERKEY, operator);
  loadDB();
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("operatorName").textContent = "OPERADOR: " + operator.toUpperCase();
  render();
}
function findAgent(id){return db.agents.find(a=>a.id===id)}
function heading(t,s,b=""){return `<div class="heading"><div><h1>${t}</h1><div class="sub">${s}</div></div>${b}</div>`}
function go(p){selected=null;page=p;lastRoll=null;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function render(){const root=document.getElementById("main");if(selected){const a=findAgent(selected);if(a){renderAgent(root,a);return}selected=null}if(page==="home")renderHome(root);if(page==="agents")renderAgents(root);if(page==="dice")renderDice(root);if(page==="campaigns")renderCampaigns(root);if(page==="backup")renderBackup(root);if(page==="settings")renderSettings(root)}
function newAgent(){const a={id:uid(),owner:operator,sharedCampaigns:[],sharedWith:[],name:"Novo personagem",className:"",age:"",level:"1",system:"Sistema próprio",description:"",story:"",notes:"",image:"",attributes:[{id:uid(),name:"Força",value:1},{id:uid(),name:"Agilidade",value:1},{id:uid(),name:"Presença",value:1},{id:uid(),name:"Vigor",value:1},{id:uid(),name:"Intelecto",value:1}],skills:DEFAULT_SKILLS.map(n=>({id:uid(),name:n,value:0,attribute:""})),resources:[{id:uid(),name:"Vida (PV)",current:20,max:20},{id:uid(),name:"Sanidade (SAN)",current:20,max:20},{id:uid(),name:"Esforço (PE)",current:5,max:5},{id:uid(),name:"Mana (PM)",current:5,max:5}],abilities:[],inventory:[],created:new Date().toISOString()};db.agents.push(a);if(!saveDB()){db.agents.pop();return}selected=a.id;page="agents";tab="geral";lastRoll=null;render();notify("Ficha criada e salva!")}
function canEditAgent(id){const a=findAgent(id);if(!a)return false;if(a.owner===operator)return true;return db.requests.some(r=>r.character===id&&r.master===operator&&r.owner===a.owner&&r.status==="approved")}
function openAgent(id){if(!canEditAgent(id))return notify("Você não tem autorização para editar esta ficha.");selected=id;tab="geral";lastRoll=null;render()}
function backAgents(){selected=null;page="agents";lastRoll=null;render()}
function renderHome(root){root.innerHTML=heading("CENTRAL DE OPERAÇÕES","Bem-vindo ao ZIKYS.")+`<div class="grid3"><div class="stat"><strong>${db.agents.length}</strong><span>PERSONAGENS</span></div><div class="stat"><strong>${db.campaigns.length}</strong><span>CAMPANHAS</span></div><div class="stat"><strong>${db.rolls.length}</strong><span>ROLAGENS</span></div></div><div class="panel" style="margin-top:15px"><h2>ACESSO RÁPIDO</h2><div class="btnrow"><button class="btn" onclick="newAgent()">＋ CRIAR FICHA</button><button class="btn gray" onclick="go('agents')">VER PERSONAGENS</button><button class="btn gray" onclick="go('dice')">TERMINAL DE DADOS</button></div></div><div class="panel"><h2>PERSONAGENS RECENTES</h2>${db.agents.length?db.agents.slice(-5).reverse().map(agentCard).join(""):'<div class="empty">Nenhuma ficha criada.</div>'}</div>`}
function agentCard(a){return `<div class="agent"><div style="display:flex;gap:12px;align-items:center"><div class="portrait" style="width:55px;height:60px">${a.image?`<img src="${a.image}" alt="Personagem">`:"SEM FOTO"}</div><div><div class="agenttitle">${esc(a.name)}</div><div class="muted">${esc(a.className||"Sem classe")} • ${esc(a.system||"Sistema próprio")}</div><div class="muted">Proprietário: ${esc(a.owner||"—")}</div></div></div><div class="btnrow" style="margin-top:12px"><button class="btn sm" onclick="openAgent('${a.id}')">ABRIR FICHA</button><button class="btn sm gray" onclick="quickRoll('${a.id}')">ROLAR D20</button></div></div>`}
function renderAgents(root){const own=db.agents.filter(a=>a.owner===operator);root.innerHTML=heading("AGENTES","Suas fichas cadastradas.",'<button class="btn" onclick="newAgent()">＋ NOVA FICHA</button>')+(own.length?own.map(agentCard).join(""):'<div class="empty">Crie sua primeira ficha para começar.</div>')}
function renderAgent(root,a){const tabs=[["geral","Geral"],["atributos","Atributos"],["pericias","Perícias"],["habilidades","Habilidades"],["inventario","Inventário"],["historia","História"],["custom","Personalização"]];root.innerHTML=`<div class="heading"><div><button class="btn gray sm" onclick="backAgents()">← VOLTAR</button><div class="statusline">● SALVAMENTO AUTOMÁTICO ATIVADO</div></div><div class="btnrow"><button class="btn gray" onclick="exportOne('${a.id}')">EXPORTAR</button><button class="btn" onclick="shareAgentMenu('${a.id}')">COMPARTILHAR</button>${a.owner===operator?`<button class="btn red" onclick="deleteAgent('${a.id}')">EXCLUIR FICHA</button>`:""}</div></div><div class="character-header"><div class="portrait large" id="portraitPreview">${a.image?`<img src="${a.image}" alt="Imagem de ${esc(a.name)}">`:"IMAGEM DO PERSONAGEM"}</div><div style="flex:1;min-width:0"><h1>${esc(a.name)}</h1><div class="sub">${esc(a.className||"Sem classe")} • ${esc(a.system||"Sistema próprio")}</div><div class="portrait-actions"><button class="btn" onclick="document.getElementById('imageInput').click()">＋ ESCOLHER IMAGEM</button><button class="btn gray" onclick="removePortrait('${a.id}')">REMOVER FOTO</button></div><input id="imageInput" type="file" accept="image/*" onchange="uploadPortrait('${a.id}',this)"><div class="muted" style="margin-top:8px">A imagem é salva nesta ficha.</div></div></div><div class="grid" id="resources">${a.resources.map(r=>resourceHTML(a,r)).join("")}</div><div class="tabs">${tabs.map(t=>`<button class="tab ${tab===t[0]?"active":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div><div id="sheetRollOutput" class="roll-output">${lastRoll||""}</div><div id="tabContent"></div>`;const c=document.getElementById("tabContent");({geral:generalTab,atributos:attributesTab,pericias:skillsTab,habilidades:abilitiesTab,inventario:inventoryTab,historia:storyTab,custom:customTab})[tab](c,a)}
function uploadPortrait(id,input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith("image/"))return notify("Escolha uma imagem.");if(f.size>12*1024*1024)return notify("Imagem muito grande (limite 12 MB).");const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,700/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);const a=findAgent(id),old=a.image;a.image=cv.toDataURL("image/jpeg",.82);if(!saveDB()){a.image=old;return}render();notify("Imagem salva!")};im.onerror=()=>notify("Não foi possível abrir a imagem.");im.src=rd.result};rd.onerror=()=>notify("Erro ao carregar imagem.");rd.readAsDataURL(f)}
function removePortrait(id){const a=findAgent(id);if(!a||!a.image)return notify("Sem imagem.");if(!confirm("Remover a imagem?"))return;a.image="";saveDB();render()}
function resourceHTML(a,r){const pct=Number(r.max)>0?Math.max(0,Math.min(100,100*Number(r.current)/Number(r.max))):0;return `<div class="resource"><div class="resourcehead"><strong>${esc(r.name)}</strong><span>${Number(r.current)} / ${Number(r.max)}</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="resourcefields"><div><label>Atual</label><input type="number" value="${Number(r.current)}" onchange="setResource('${a.id}','${r.id}','current',this.value)"></div><div><label>Máximo</label><input type="number" min="0" value="${Number(r.max)}" onchange="setResource('${a.id}','${r.id}','max',this.value)"></div></div><div class="resourcebuttons"><button class="btn sm gray" onclick="resourceDelta('${a.id}','${r.id}',-1)">−1</button><button class="btn sm gray" onclick="resourceDelta('${a.id}','${r.id}',1)">+1</button><button class="btn sm gray" onclick="renameResource('${a.id}','${r.id}')">RENOMEAR</button><button class="btn sm red" onclick="removeResource('${a.id}','${r.id}')">×</button></div></div>`}
function refreshResources(a){const b=document.getElementById("resources");if(b)b.innerHTML=a.resources.map(r=>resourceHTML(a,r)).join("")}
function setResource(id,rid,f,v){const a=findAgent(id),r=a?.resources.find(x=>x.id===rid);if(!r)return;r[f]=Math.max(0,Number(v)||0);r.current=Math.min(r.current,r.max);saveDB();refreshResources(a)}
function resourceDelta(id,rid,d){const a=findAgent(id),r=a?.resources.find(x=>x.id===rid);if(!r)return;r.current=Math.max(0,Math.min(Number(r.max),Number(r.current)+d));saveDB();refreshResources(a)}
function renameResource(id,rid){const a=findAgent(id),r=a.resources.find(x=>x.id===rid),n=prompt("Nome do recurso:",r.name);if(n===null)return;r.name=n.trim()||r.name;saveDB();refreshResources(a)}
function removeResource(id,rid){if(!confirm("Remover recurso?"))return;const a=findAgent(id);a.resources=a.resources.filter(r=>r.id!==rid);saveDB();refreshResources(a)}
function addResource(id){const name=prompt("Nome do recurso:");if(!name)return;const max=Number(prompt("Valor máximo:","10"))||0;const a=findAgent(id);a.resources.push({id:uid(),name,current:max,max});saveDB();render()}
function generalTab(c,a){c.innerHTML=`<div class="panel"><h2>IDENTIFICAÇÃO</h2><div class="formgrid"><div><label>Nome</label><input value="${esc(a.name)}" oninput="updateAgent('${a.id}','name',this.value);updateCharacterTitle(this.value)"></div><div><label>Classe / Ocupação</label><input value="${esc(a.className)}" oninput="updateAgent('${a.id}','className',this.value)"></div><div><label>Idade</label><input value="${esc(a.age)}" oninput="updateAgent('${a.id}','age',this.value)"></div><div><label>Nível / NEX / Patamar</label><input value="${esc(a.level)}" oninput="updateAgent('${a.id}','level',this.value)"></div><div><label>Sistema</label><input value="${esc(a.system)}" oninput="updateAgent('${a.id}','system',this.value)"></div></div><label>Descrição</label><textarea oninput="updateAgent('${a.id}','description',this.value)">${esc(a.description)}</textarea></div><div class="panel"><h2>RECURSOS DA FICHA</h2><div class="muted">Adicione recursos do seu sistema.</div><button class="btn" style="margin-top:12px" onclick="addResource('${a.id}')">＋ ADICIONAR RECURSO</button></div>`}
function updateCharacterTitle(v){const t=document.querySelector(".character-header h1");if(t)t.textContent=v}
function updateAgent(id,f,v){const a=findAgent(id);if(a){a[f]=v;saveDB()}}
function attributesTab(c,a){
 c.innerHTML=`<div class="panel">
  <div class="heading">
   <div><h2>ATRIBUTOS DO PERSONAGEM</h2><div class="muted">As alterações são salvas automaticamente no dispositivo.</div></div>
   <button class="btn" onclick="addAttribute('${a.id}')">＋ ATRIBUTO</button>
  </div>
  <div class="grid3">${a.attributes.map(x=>`
   <div class="resource">
    <label>${esc(x.name)}</label>
    <input type="number" min="0" step="1" value="${Math.max(0,Math.floor(Number(x.value)||0))}"
     oninput="setAttribute('${a.id}','${x.id}',this.value)"
     onchange="setAttribute('${a.id}','${x.id}',this.value)"
     onblur="setAttribute('${a.id}','${x.id}',this.value)">
    <div class="statusline" id="saved_${x.id}">● SALVO</div>

function setAttribute(id,aid,v){
 const a=findAgent(id);
 if(!a)return;
 const x=a.attributes.find(z=>z.id===aid);
 if(!x)return;
 const textValue=String(v).trim();
 if(textValue===""){x.value=0}else{
  const n=Number(textValue);
  if(!Number.isFinite(n))return;
  x.value=Math.max(0,Math.floor(n));
 }
 const saved=saveDB();
 const status=document.getElementById("saved_"+aid);
 if(status){
  status.textContent=saved?"● SALVO NO DISPOSITIVO":"● FALHA AO SALVAR";
  status.style.color=saved?"var(--green)":"var(--red)";
 }
}

function doRoll(sides,qty,mod,label){const results=[];for(let i=0;i<qty;i++)results.push(Math.floor(Math.random()*sides)+1);const diceTotal=results.reduce((x,y)=>x+y,0),total=diceTotal+mod,record={id:uid(),date:new Date().toLocaleString("pt-BR"),label,results,total,mod,sides,qty};db.rolls.unshift(record);db.rolls=db.rolls.slice(0,150);saveDB();lastRoll=`<div class="panel"><div class="muted">RESULTADO DO TESTE</div><h2>${esc(label)}</h2><div class="diceout"><div class="muted">${qty}D${sides}</div><strong>${total}</strong><div class="muted">Dados: ${results.join(" + ")}<br>Modificador: ${mod>=0?"+":""}${mod}<br>Resultado dos dados: ${diceTotal}</div></div></div>`;const s=document.getElementById("sheetRollOutput"),t=document.getElementById("rollOutput");if(s)s.innerHTML=lastRoll;if(t)t.innerHTML=lastRoll;notify("Rolagem realizada!")}

function campaignCode(){return "ZK-"+Math.random().toString(36).slice(2,8).toUpperCase()}

function addCampaign(){const name=prompt("Nome da campanha:");if(!name||!name.trim())return;const system=prompt("Sistema:","Sistema próprio");if(system===null)return;const description=prompt("Descrição:","");if(description===null)return;const c={id:uid(),name:name.trim(),system:system.trim(),description,master:operator,members:[operator],invite:campaignCode(),status:"Em andamento",created:new Date().toISOString()};db.campaigns.push(c);if(!saveDB()){db.campaigns.pop();return}render();notify("Campanha criada!")}

function openCampaign(id){const c=getCampaign(id);if(!c||!isMember(c))return notify("Campanha não encontrada.");const master=isMaster(c),members=c.members.map(n=>`<div class="entry"><b>${esc(n)}</b> <span class="tag">${n===c.master?"MESTRE":"JOGADOR"}</span><div class="muted">${db.agents.filter(a=>a.owner===n&&(a.sharedCampaigns||[]).includes(c.id)).length} personagem(ns) compartilhado(s)</div>${master&&n!==operator?`<button class="btn red sm" onclick="removeCampaignMember('${c.id}','${encodeURIComponent(n)}')">REMOVER JOGADOR</button>`:""}</div>`).join(""),shared=db.agents.filter(a=>(a.sharedCampaigns||[]).includes(c.id)),own=db.agents.filter(a=>a.owner===operator);document.getElementById("main").innerHTML=`<div class="heading"><div><button class="btn gray sm" onclick="render()">← VOLTAR</button><h1 style="margin-top:12px">${esc(c.name)}</h1><div class="sub">${esc(c.system)} • ${esc(c.description)}</div></div>${master?'<span class="tag">MESTRE DA CAMPANHA</span>':''}</div><div class="panel"><h2>CONVITE PRIVADO</h2><div class="diceout"><strong style="font-size:25px">${esc(c.invite)}</strong><div class="muted">Compartilhe este código com os jogadores.</div></div><div class="btnrow"><button class="btn" onclick="copyCampaignInvite('${c.id}')">COPIAR CONVITE</button>${master?`<button class="btn gray" onclick="regenerateCampaignInvite('${c.id}')">GERAR NOVO CÓDIGO</button>`:""}</div></div><div class="panel"><h2>PARTICIPANTES (${c.members.length})</h2>${members}</div><div class="panel"><h2>FICHAS COMPARTILHADAS COM A CAMPANHA</h2>${shared.length?shared.map(a=>`<div class="agent"><div class="agenttitle">${esc(a.name)}</div><div class="muted">Jogador: ${esc(a.owner)}</div><div class="btnrow" style="margin-top:9px"><button class="btn sm" onclick="viewCampaignAgent('${a.id}')">VISUALIZAR FICHA</button>${master&&a.owner!==operator?`<button class="btn sm gray" onclick="requestMasterEdit('${a.id}')">SOLICITAR EDIÇÃO</button>`:""}${a.owner===operator?`<button class="btn sm red" onclick="unshareCampaignAgent('${a.id}','${c.id}')">RETIRAR FICHA</button>`:""}</div></div>`).join(""):'<div class="empty">Nenhum personagem foi compartilhado.</div>'}</div><div class="panel"><h2>MEUS PERSONAGENS</h2><div class="muted">Você pode criar personagens ilimitados e escolher quais aparecem nesta campanha.</div>${own.length?own.map(a=>`<div class="entry"><b>${esc(a.name)}</b><div class="muted">${(a.sharedCampaigns||[]).includes(c.id)?"Compartilhada com esta campanha":"Privada nesta campanha"}</div><button class="btn sm" onclick="toggleCampaignShare('${a.id}','${c.id}')">${(a.sharedCampaigns||[]).includes(c.id)?"RETIRAR COMPARTILHAMENTO":"COMPARTILHAR COM CAMPANHA"}</button></div>`).join(""):'<div class="empty">Você ainda não criou personagens.</div>'}<button class="btn" onclick="newAgent()">＋ CRIAR PERSONAGEM</button></div>${master?`<div class="panel"><h2>PAINEL DO MESTRE</h2><p class="muted">Você pode visualizar fichas compartilhadas. Para editar, precisa da autorização do jogador.</p>${renderMasterRequests(c.id)}<hr><button class="btn red" onclick="deleteCampaign('${c.id}')">EXCLUIR CAMPANHA</button></div>`:""}`}

function requestIndividualEdit(aid){const a=findAgent(aid);if(!a||a.owner===operator)return;if(db.requests.some(r=>r.character===aid&&r.master===operator&&r.status==="pending"))return notify("Solicitação já enviada.");db.requests.push({id:uid(),character:aid,owner:a.owner,master:operator,campaign:null,status:"pending",created:new Date().toISOString()});saveDB();notify("Solicitação enviada.");renderCampaigns(document.getElementById("main"))}
function renderMasterRequests(cid){const rs=db.requests.filter(r=>r.master===operator&&r.campaign===cid&&r.status==="pending");return rs.map(r=>`<div class="entry">${esc(findAgent(r.character)?.name||"Personagem")} — aguardando autorização do jogador.</div>`).join("")||'<div class="empty">Nenhuma solicitação pendente.</div>'}
function renderMyRequests(){const rs=db.requests.filter(r=>r.owner===operator&&r.status==="pending");if(!rs.length)return "";return `<div class="panel"><h2>SOLICITAÇÕES DE EDIÇÃO RECEBIDAS</h2>${rs.map(r=>`<div class="entry"><b>${esc(r.master)}</b> deseja editar <b>${esc(findAgent(r.character)?.name||"Personagem")}</b>.<div class="btnrow"><button class="btn sm" onclick="answerEditRequest('${r.id}',true)">AUTORIZAR</button><button class="btn red sm" onclick="answerEditRequest('${r.id}',false)">RECUSAR</button></div></div>`).join("")}</div>`}
function answerEditRequest(id,ok){const r=db.requests.find(x=>x.id===id);if(!r||r.owner!==operator)return;r.status=ok?"approved":"denied";saveDB();render();notify(ok?"Edição autorizada!":"Solicitação recusada.")}
function copyCampaignInvite(id){const c=getCampaign(id);if(!c||!isMember(c))return;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(c.invite).then(()=>notify("Convite copiado!")).catch(()=>prompt("Copie o código:",c.invite));else prompt("Copie o código:",c.invite)}
function regenerateCampaignInvite(id){const c=getCampaign(id);if(!c||!isMaster(c))return;if(!confirm("O código antigo deixará de funcionar. Continuar?"))return;c.invite=campaignCode();saveDB();openCampaign(id);notify("Novo convite gerado!")}
function removeCampaignMember(id,encoded){const c=getCampaign(id),name=decodeURIComponent(encoded);if(!c||!isMaster(c)||name===c.master)return;if(!confirm("Remover jogador?"))return;c.members=c.members.filter(x=>x!==name);saveDB();openCampaign(id)}
function deleteCampaign(id){const c=getCampaign(id);if(!c||!isMaster(c))return notify("Somente o mestre pode excluir.");if(!confirm("Excluir campanha?"))return;db.campaigns=db.campaigns.filter(x=>x.id!==id);db.agents.forEach(a=>a.sharedCampaigns=(a.sharedCampaigns||[]).filter(x=>x!==id));db.requests=db.requests.filter(r=>r.campaign!==id);saveDB();render();notify("Campanha excluída.")}
function deleteAgent(id){const a=findAgent(id);if(!a||a.owner!==operator)return notify("Somente o proprietário pode excluir.");if(!confirm("Excluir esta ficha?"))return;db.agents=db.agents.filter(x=>x.id!==id);db.requests=db.requests.filter(r=>r.character!==id);saveDB();selected=null;page="agents";render()}
function downloadJSON(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportOne(id){const a=findAgent(id);if(a)downloadJSON(a,"ZIKYS_"+a.name.replace(/[^a-z0-9]/gi,"_")+".json")}
function renderBackup(root){root.innerHTML=heading("BACKUP E ARQUIVOS","Proteja suas fichas.")+`<div class="panel"><h2>EXPORTAR TUDO</h2><p class="muted">Baixe fichas, imagens, campanhas, solicitações e rolagens.</p><button class="btn" onclick="downloadJSON(db,'ZIKYS_BACKUP.json')">↓ EXPORTAR BACKUP</button><hr><h2>IMPORTAR BACKUP</h2><p class="muted">A importação substitui os dados atuais. Faça um backup antes.</p><input id="backupFile" type="file" accept=".json,application/json"><button class="btn gray" style="margin-top:10px" onclick="importBackup()">IMPORTAR</button></div><div class="panel"><h2>ARMAZENAMENTO</h2><div class="muted">As fichas ficam no navegador deste dispositivo nesta versão.</div></div>`}
function importBackup(){const f=document.getElementById("backupFile").files[0];if(!f)return notify("Escolha um arquivo.");const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.agents)||!Array.isArray(d.campaigns)||!Array.isArray(d.rolls))throw Error();d.requests=Array.isArray(d.requests)?d.requests:[];if(!confirm("Substituir os dados atuais pelo backup?"))return;const old=db;db=d;if(!saveDB()){db=old;return}db.agents.forEach(a=>{a.owner=a.owner||operator;a.sharedCampaigns=a.sharedCampaigns||[];a.sharedWith=a.sharedWith||[]});selected=null;lastRoll=null;render();notify("Backup importado!")}catch(e){notify("Arquivo inválido.")}};rd.readAsText(f)}
function renderSettings(root){root.innerHTML=heading("CONFIGURAÇÕES","Informações do terminal.")+`<div class="panel"><h2>OPERADOR</h2><div class="muted">Identificação atual: ${esc(operator)}</div><button class="btn gray" style="margin-top:10px" onclick="changeOperator()">ALTERAR NOME</button></div><div class="panel"><h2>ESTADO DO SISTEMA</h2><div class="muted">Fichas: ${db.agents.length}<br>Campanhas: ${db.campaigns.length}<br>Rolagens: ${db.rolls.length}</div></div><div class="panel"><h2>INFORMAÇÃO IMPORTANTE</h2><div class="muted">Esta versão ainda funciona localmente. O nome do operador não é uma conta protegida por senha. Para compartilhar campanhas entre celulares e computadores, será necessário conectar um banco de dados online.</div></div><div class="panel"><button class="btn red" onclick="resetAll()">APAGAR TODOS OS DADOS</button></div>`}
function changeOperator(){const n=prompt("Novo nome:",operator);if(!n||!n.trim())return;operator=n.trim();localStorage.setItem(USERKEY,operator);document.getElementById("operatorName").textContent="OPERADOR: "+operator.toUpperCase();render()}
function resetAll(){if(!confirm("Apagar todas as fichas, campanhas e rolagens?"))return;if(!confirm("Esta ação não pode ser desfeita. Continuar?"))return;db={agents:[],campaigns:[],rolls:[],requests:[]};saveDB();selected=null;lastRoll=null;render();notify("Dados apagados.")}

(async function initZikys(){
  const { data, error } = await supabaseClient.auth.getSession();
  if(error){
    console.error("Erro ao verificar sessão:", error);
    notify("Erro ao conectar com a autenticação.");
    return;
  }
  if(data.session){
    start(data.session.user);
  }else{
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
  }
  supabaseClient.auth.onAuthStateChange((event, session)=>{
    if(session && event === "SIGNED_IN"){
      start(session.user);
    }
  });
})();
</script>
